services:
  - type: web
    name: phonebridge-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PHONEBRIDGE_DB
        value: /var/data/phonebridge_relay.db
    disk:
      name: relay-data
      mountPath: /var/data
      sizeGB: 1
