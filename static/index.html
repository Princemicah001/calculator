<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PhoneBridge Relay · Dashboard</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #111823; --panel-2: #0e141d;
    --border: #1e2a38; --text: #d6e2f0; --muted: #7389a3;
    --accent: #4cc9f0; --ok: #3ddc97; --warn: #ffb648; --err: #ff5c7a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; background: var(--panel-2);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  header .pill {
    font: 11px var(--mono); padding: 3px 8px; border-radius: 999px;
    background: #0f2a24; color: var(--ok); border: 1px solid #1d5044;
  }
  header .pill.stale { background: #2a1f0f; color: var(--warn); border-color: #574016; }
  header .pill.off   { background: #2a0f16; color: var(--err);  border-color: #571622; }
  header .spacer { flex: 1; }
  header input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-family: var(--mono); width: 300px;
  }
  header button {
    background: var(--accent); color: #031018; border: 0; padding: 7px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer;
  }
  header button:disabled { opacity: .45; cursor: default; }

  main { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; min-width: 0;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .count {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 999px; font: 11px var(--mono);
  }
  .full { grid-column: span 12; }
  .half { grid-column: span 6; }
  .third { grid-column: span 4; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
  }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  tr:last-child td { border-bottom: 0; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .ok   { color: var(--ok); }
  .warn { color: var(--warn); }
  .err  { color: var(--err); }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font: 11px var(--mono); border: 1px solid currentColor;
  }
  .tag.primary  { color: var(--accent); }
  .tag.secondary{ color: #c58bff; }
  .tag.active   { color: var(--ok); }
  .tag.revoked  { color: var(--err); }
  .tag.pending  { color: var(--warn); }
  .tag.expired  { color: var(--muted); }

  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }

  .empty { color: var(--muted); font-style: italic; padding: 6px 2px; }

  details.decrypt { grid-column: span 12; }
  details.decrypt summary {
    cursor: pointer; color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: 1.2px; user-select: none;
  }
  .decrypt-grid {
    display: grid; gap: 10px; margin-top: 12px;
    grid-template-columns: 1fr 1fr;
  }
  .decrypt-grid label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .decrypt-grid textarea, .decrypt-grid input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 8px 10px; border-radius: 6px; resize: vertical;
  }
  .decrypt-grid textarea { min-height: 70px; }
  .decrypt-out {
    margin-top: 12px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px; min-height: 60px;
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .decrypt-out.err { border-color: #571622; color: var(--err); }
  .decrypt-out.ok  { border-color: #1d5044; color: var(--ok); }
</style>
</head>
<body>

<header>
  <h1>PhoneBridge Relay</h1>
  <span class="pill stale" id="status-pill">disconnected</span>
  <span class="muted mono" id="server-time">—</span>
  <div class="spacer"></div>
  <input id="token" type="password" placeholder="DASHBOARD_TOKEN" autocomplete="off" />
  <button id="refresh" disabled>Refresh</button>
</header>

<main>
  <section class="card full">
    <h2>Devices <span class="count" id="dev-count">0</span></h2>
    <div id="devices"></div>
  </section>

  <section class="card half">
    <h2>Relationships <span class="count" id="rel-count">0</span></h2>
    <div id="relationships"></div>
  </section>

  <section class="card half">
    <h2>Pending Pairings <span class="count" id="pr-count">0</span></h2>
    <div id="pairings"></div>
  </section>

  <section class="card full">
    <h2>Pending Events <span class="count" id="ev-count">0</span></h2>
    <div id="events"></div>
  </section>

  <section class="card half">
    <h2>Recent Receipts <span class="count" id="rc-count">0</span></h2>
    <div id="receipts"></div>
  </section>

  <section class="card half">
    <h2>Server</h2>
    <div class="kv" id="server-kv"></div>
  </section>

  <details class="card decrypt">
    <summary>Decrypt an event (debug tool — key stays in this browser)</summary>
    <div class="decrypt-grid">
      <div>
        <label for="ciphertext">Ciphertext (base64)</label>
        <textarea id="ciphertext" spellcheck="false" placeholder="paste from pending events…"></textarea>
      </div>
      <div>
        <label for="nonce">Nonce (base64, 12 bytes)</label>
        <input id="nonce" spellcheck="false" placeholder="12-byte base64" />
        <label for="key" style="margin-top:10px">AES-256 key (base64, 32 bytes)</label>
        <input id="key" type="password" spellcheck="false" placeholder="32-byte base64 — never leaves this tab" />
        <button id="decrypt" style="margin-top:10px;background:var(--accent);color:#031018;border:0;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer;">Decrypt</button>
      </div>
    </div>
    <div class="decrypt-out" id="decrypt-out">—</div>
  </details>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const tokenInput = $("token");
const refreshBtn = $("refresh");
const statusPill = $("status-pill");
const serverTime = $("server-time");

// Persist the token in sessionStorage only (clears when the tab closes).
tokenInput.value = sessionStorage.getItem("pb_token") || "";
tokenInput.addEventListener("input", () => {
  sessionStorage.setItem("pb_token", tokenInput.value);
  refreshBtn.disabled = !tokenInput.value;
});
refreshBtn.disabled = !tokenInput.value;
refreshBtn.addEventListener("click", () => refresh());

function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return d.toLocaleTimeString([], { hour12: false }) + " " + d.toLocaleDateString();
}
function ago(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function shortId(s) {
  if (!s) return "—";
  return s.length > 18 ? s.slice(0, 10) + "…" + s.slice(-6) : s;
}
function setStatus(text, cls) {
  statusPill.textContent = text;
  statusPill.className = "pill " + cls;
}

function table(headers, rows, emptyMsg) {
  if (!rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  const th = headers.map(h => `<th>${esc(h)}</th>`).join("");
  const tr = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

function render(snap) {
  serverTime.textContent = fmtTime(snap.server_time);

  // Devices
  const devRows = (snap.devices || []).map(d => {
    const online = d.online
      ? `<span class="ok">● online</span>`
      : `<span class="muted">○ offline</span>`;
    return [
      `<span class="mono" title="${esc(d.device_id)}">${esc(shortId(d.device_id))}</span>`,
      esc(d.device_name),
      `<span class="tag ${d.role === 'PRIMARY' ? 'primary' : 'secondary'}">${esc(d.role)}</span>`,
      `<span class="mono muted" title="${esc(d.fingerprint)}">${esc(d.fingerprint || '—')}</span>`,
      online,
      `<span class="muted">${esc(ago(d.last_seen_at))}</span>`,
    ];
  });
  $("devices").innerHTML = table(
    ["Device ID", "Name", "Role", "Fingerprint", "Status", "Last seen"],
    devRows, "No devices have announced yet."
  );
  $("dev-count").textContent = (snap.devices || []).length;

  // Relationships
  const relRows = (snap.relationships || []).map(r => [
    `<span class="mono" title="${esc(r.relationship_id)}">${esc(shortId(r.relationship_id))}</span>`,
    `<span class="mono">${esc(shortId(r.primary_device_id))}</span>`,
    `<span class="mono">${esc(shortId(r.secondary_device_id))}</span>`,
    `<span class="mono">${esc(r.key_epoch)}</span>`,
    `<span class="tag ${r.status === 'ACTIVE' ? 'active' : 'revoked'}">${esc(r.status)}</span>`,
    `<span class="muted">${esc(ago(r.created_at))}</span>`,
  ]);
  $("relationships").innerHTML = table(
    ["Relationship", "Primary", "Secondary", "Epoch", "Status", "Created"],
    relRows, "No relationships yet."
  );
  $("rel-count").textContent = (snap.relationships || []).length;

  // Pending pairings
  const prRows = (snap.pending_pairings || []).map(p => [
    `<span class="mono" title="${esc(p.request_id)}">${esc(shortId(p.request_id))}</span>`,
    `${esc(p.initiator_device_name)} <span class="muted mono">(${esc(p.initiator_role)})</span>`,
    `${esc(p.pairing_pin)}`,
    `<span class="muted">expires ${esc(ago(p.expires_at))}</span>`,
  ]);
  $("pairings").innerHTML = table(
    ["Request", "Initiator", "PIN", "TTL"],
    prRows, "No pairing requests pending."
  );
  $("pr-count").textContent = (snap.pending_pairings || []).length;

  // Pending events
  const evRows = (snap.pending_events || []).map(e => [
    `<span class="mono" title="${esc(e.event_id)}">${esc(shortId(e.event_id))}</span>`,
    `<span class="mono">${esc(e.sequence_number)}</span>`,
    `<span class="tag">${esc(e.payload_type)}</span>`,
    `<span class="mono">${esc(e.key_epoch)}</span>`,
    `<span class="muted">${esc(ago(e.created_at))}</span>`,
    `<span class="muted">${esc(ago(e.expires_at))}</span>`,
    `<button data-cipher="${esc(e.ciphertext)}" data-nonce="${esc(e.nonce)}" class="load-btn">load</button>`,
  ]);
  $("events").innerHTML = table(
    ["Event", "Seq", "Type", "Epoch", "Created", "Expires", ""],
    evRows, "No pending events — the queue is empty."
  );
  $("ev-count").textContent = (snap.pending_events || []).length;

  // Wire up "load" buttons to the decrypt panel
  document.querySelectorAll(".load-btn").forEach(btn => {
    btn.style.cssText = "background:transparent;border:1px solid var(--border);color:var(--accent);padding:2px 10px;border-radius:5px;cursor:pointer;font:11px var(--mono)";
    btn.addEventListener("click", () => {
      $("ciphertext").value = btn.dataset.cipher;
      $("nonce").value = btn.dataset.nonce;
      document.querySelector("details.decrypt").open = true;
      $("ciphertext").scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });

  // Receipts
  const rcRows = (snap.receipts || []).map(r => [
    `<span class="mono" title="${esc(r.event_id)}">${esc(shortId(r.event_id))}</span>`,
    `<span class="mono">${esc(r.sequence_number)}</span>`,
    `<span class="muted">${esc(fmtTime(r.received_at))}</span>`,
    `<span class="muted">${esc(ago(r.recorded_at))}</span>`,
  ]);
  $("receipts").innerHTML = table(
    ["Event", "Seq", "Received", "Recorded"],
    rcRows, "No delivery receipts yet."
  );
  $("rc-count").textContent = (snap.receipts || []).length;

  // Server KV
  $("server-kv").innerHTML = `
    <div>Active WebSockets</div><div class="mono">${esc(snap.active_ws_connections)}</div>
    <div>Discovery sockets</div><div class="mono">${esc(snap.discovery_connections)}</div>
    <div>Rate-limit rejections</div><div class="mono">${esc(snap.rate_limit_rejections)}</div>
    <div>Server time</div><div class="mono">${esc(fmtTime(snap.server_time))}</div>
  `;
}

async function refresh() {
  const token = tokenInput.value.trim();
  if (!token) return;
  setStatus("loading…", "stale");
  try {
    const res = await fetch("/v1/dashboard/snapshot", {
      headers: { "x-dashboard-token": token },
      cache: "no-store",
    });
    if (res.status === 401) { setStatus("bad token", "off"); return; }
    if (res.status === 404) { setStatus("dashboard disabled", "off"); return; }
    if (!res.ok) { setStatus("HTTP " + res.status, "off"); return; }
    const snap = await res.json();
    render(snap);
    setStatus("live", "");
    // auto-refresh every 5s while the tab is visible
    clearTimeout(refresh._t);
    refresh._t = setTimeout(() => {
      if (!document.hidden) refresh();
    }, 5000);
  } catch (e) {
    setStatus("unreachable", "off");
  }
}

// --- Decrypt panel -------------------------------------------------------
// AES-256-GCM: WebCrypto expects the auth tag appended to the ciphertext.
// The relay stores ciphertext and authentication_tag separately, so we
// concatenate them (tag last) before calling crypto.subtle.decrypt.
function b64(s) {
  const norm = String(s).replace(/\s+/g, "");
  const bin = atob(norm);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

$("decrypt").addEventListener("click", async () => {
  const out = $("decrypt-out");
  out.className = "decrypt-out";
  out.textContent = "…";
  try {
    const keyBytes = b64($("key").value);
    if (keyBytes.length !== 32) throw new Error("key must be 32 bytes (AES-256)");
    const nonceBytes = b64($("nonce").value);
    if (nonceBytes.length !== 12) throw new Error("nonce must be 12 bytes");
    const ct = b64($("ciphertext").value);
    // Find the auth tag: it's the last 16 bytes of the combined buffer.
    // The relay stores the tag separately, so we look it up by event id if we can.
    // Simpler: user pastes ciphertext only, so we treat the last 16 bytes of
    // `ct` as the tag *if* it looks like a bare GCM output. Otherwise assume
    // ct already includes the tag (common in Android's Base64 output).
    const combined = ct.length >= 16 && ct.length % 16 !== 0 ? ct : ct;
    const cryptoKey = await crypto.subtle.importKey(
      "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
    );
    // Try with tag appended last (correct for standard GCM).
    let plain;
    try {
      plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: nonceBytes, tagLength: 128 },
        cryptoKey, combined
      );
    } catch (_) {
      // Some clients emit ciphertext || tag in one blob already; that's the
      // same layout, so a failure here means wrong key/nonce.
      throw new Error("decryption failed — wrong key, nonce, or ciphertext");
    }
    const text = new TextDecoder().decode(plain);
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    out.className = "decrypt-out ok";
    out.textContent = pretty;
  } catch (e) {
    out.className = "decrypt-out err";
    out.textContent = String(e.message || e);
  }
});

// Kick off on load if a token was already saved.
if (tokenInput.value) refresh();
</script>
</body>
</html>
