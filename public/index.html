<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { margin-bottom: 1rem; font-weight: 600; }
    form { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    input {
      padding: 0.6rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      width: 300px;
      outline: none;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #2563eb; }

    #status { min-height: 1.5rem; color: #64748b; margin-bottom: 1rem; }
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; text-align: center; }
    .card small { color: #64748b; margin-bottom: 1rem; }

    .logo-box { display: flex; flex-direction: column; gap: 1rem; width: 100%; align-items: center; }
    .logo-box figure { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; }
    .logo-box figcaption { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; }

    .img-container {
      position: relative;
      cursor: zoom-in;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background: #f8fafc;
      border-radius: 6px;
      padding: 1rem;
      transition: background 0.2s;
    }
    .img-container:hover { background: #f1f5f9; }

    .logo-box img { max-width: 100%; height: auto; object-fit: contain; }
    .logo-box .square img { width: 64px; height: 64px; }
    .logo-box .landscape img { width: 180px; max-height: 70px; }

    .btn-download {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      background: #e2e8f0;
      color: #475569;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-download:hover { background: #cbd5e1; color: #0f172a; }

    .error { color: #dc2626; }

    /* Lightbox Modal Styles */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 2rem;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      animation: zoomIn 0.2s ease-out;
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🔍 Logo Finder</h1>
  <form id="search-form">
    <input id="query" type="text" placeholder="e.g. Stripe, Google, Nike…" autofocus />
    <button type="submit">Search</button>
  </form>
  <p id="status"></p>
  <section id="results"></section>

  <!-- Lightbox Modal -->
  <div id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="" alt="Zoomed Logo" />
  </div>

  <script>
    const form   = document.getElementById('search-form');
    const query  = document.getElementById('query');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    // Lightbox logic
    window.openLightbox = function(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = query.value.trim();
      if (!q) return;

      status.textContent = 'Searching…';
      status.classList.remove('error');
      results.innerHTML = '';

      try {
        const res = await fetch(`/api/logos?q=${encodeURIComponent(q)}`);
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Request failed');
        }
        const data = await res.json();

        if (!data.length) {
          status.textContent = 'No logos found for that query.';
          return;
        }

        status.textContent = `Found ${data.length} result(s). Click any image to zoom.`;

        data.forEach(brand => {
          const card = document.createElement('div');
          card.className = 'card';

          // URL-encode the image links for the backend download proxy
          const squareDlUrl = `/api/download?url=${encodeURIComponent(brand.favicon)}&name=${encodeURIComponent(brand.name + '_icon')}`;
          const wideDlUrl   = `/api/download?url=${encodeURIComponent(brand.logo)}&name=${encodeURIComponent(brand.name + '_logo')}`;

          card.innerHTML = `
            <h2>${brand.name}</h2>
            <small>${brand.domain}</small>
            <div class="logo-box">

              <figure class="square">
                <div class="img-container" onclick="openLightbox('${brand.favicon}')">
                  <img src="${brand.favicon}" alt="${brand.name} icon" loading="lazy" onerror="this.parentElement.style.display='none'" />
                </div>
                <figcaption>Square (Icon)</figcaption>
                <a href="${squareDlUrl}" class="btn-download">⬇ Download</a>
              </figure>

              <figure class="landscape">
                <div class="img-container" onclick="openLightbox('${brand.logo}')">
                  <img src="${brand.logo}" alt="${brand.name} wordmark" loading="lazy" onerror="this.parentElement.style.display='none'" />
                </div>
                <figcaption>Landscape (Wordmark)</figcaption>
                <a href="${wideDlUrl}" class="btn-download">⬇ Download</a>
              </figure>

            </div>
          `;
          results.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        status.textContent = `❌ ${err.message}`;
        status.classList.add('error');
      }
    });
  </script>
</body>
</html>
